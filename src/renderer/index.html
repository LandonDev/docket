<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Ported from MonoCode's Tauri CSP. The packaged page lives on
         tempcode-app://renderer (src/main/appScheme.ts), so 'self' is that
         origin, stricter than the file:// it replaced; loopback ws:// to the
         local server stays allowed from a secure origin. tempcode-asset:
         serves project logos and agent HTML pages (frame-src) through a
         scoped custom protocol; blob:/data: cover previews and the
         shiki/Monaco workers; connect-src allows the local server's
         WebSocket (dynamic port) and, in dev, vite's HMR origin. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' tempcode-asset: data: blob: https://avatars.githubusercontent.com https://uploads.linear.app https://lh3.googleusercontent.com; font-src 'self' data:; connect-src 'self' ws: wss: ws://127.0.0.1:* ws://localhost:* http://localhost:5173 ws://localhost:5173 http://127.0.0.1:5173 ws://127.0.0.1:5173; media-src 'self' tempcode-asset: data: blob:; object-src 'none'; base-uri 'self'; frame-src tempcode-asset:"
    />
    <title>TempCode</title>
    <script src="./boot.js"></script>
    <style>
      /* The splash's two colours are `background` and `foreground` of each
         theme, copied from src/renderer/src/index.css, which has not loaded
         yet (src/renderer/src/splash.test.ts holds them equal). boot.js sets
         `theme-light` before this paints. */
      :root {
        --boot-background: oklch(0.195 0.003 270);
        --boot-foreground: oklch(0.93 0.003 270);
      }

      html.theme-light {
        --boot-background: oklch(1 0 0);
        --boot-foreground: oklch(0.2 0.012 264);
      }

      html,
      body,
      #boot-splash {
        margin: 0;
        background: var(--boot-background);
      }

      /* Opaque cover until React paints. The logo is in HTML so it is
         visible during the Dock bounce, before the bundle runs. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        transition: opacity 0.16s ease;
      }

      #boot-splash.boot-splash-out {
        opacity: 0;
      }

      /* The logo is one shape in white: drawn as a mask, it takes the
         theme's ink and shows on a white ground as on a dark one. */
      #boot-mark {
        width: 72px;
        height: 72px;
        background: var(--boot-foreground);
        -webkit-mask: url("./monocode.png") center / contain no-repeat;
        mask: url("./monocode.png") center / contain no-repeat;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div id="boot-mark"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
