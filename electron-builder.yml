appId: dev.landon.tempcode
productName: TempCode
copyright: Copyright © 2026 Landon Hale
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,CLAUDE.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,vitest.config.ts}'
  - '!{artifacts,build,dist,release,.githooks,.temp-code,.claude}/**'
  # The iOS packages, the hub Worker, the computer-use service's Swift source
  # (built into resources/native) and the docs are not app code. The
  # gate's SwiftPM `.build` output alone is thousands of files that
  # electron-builder would otherwise copy in and codesign one by one (a
  # signing of 2 minutes became 11 with them in; the zip 312 MB to 381 MB).
  - '!{ios,infra,docs,native}/**'
  # scripts/app-mcp-bridge.mjs ships (the Codex stdio bridge spawns it);
  # the TypeScript e2e drivers, their bundles and the release shell do not.
  - '!scripts/**/*.{ts,sh,swift}'
  - '!scripts/.out/**'
  - '!resources/native/*.swift'
  - '!**/*.map'
  # The renderer's chunk map (electron.vite.config.ts bundleMap) is a build report, not app code.
  - '!out/bundle-map.json'
  # work-kit is private source; the renderer and main bundles in out/ carry what
  # the app uses of it, compiled. Its folder never ships (scripts/workKitPin.test.ts).
  - '!node_modules/work-kit/**'
  # node_modules ships only what out/main and out/preload load at run time: package.json's
  # `dependencies`, kept to those by scripts/shippedDeps.test.ts; every library the renderer
  # uses is compiled into out/ and is a devDependency. Signing time follows the file count
  # (36,467 files took 3m42s in 1.0.363), so what ships of those packages is cut further
  # here: sources, other builds of the same code, and binaries neither the Mac (arm64) nor
  # Windows (x64) runs. electron-builder already drops *.d.ts, READMEs and test folders.
  - '!node_modules/node-pty/{deps,scripts,src,third_party,typings,node-addon-api}/**'
  - '!node_modules/node-pty/prebuilds/{darwin-x64,win32-arm64}/**'
  - '!node_modules/pdf-lib/{dist,es,src,ts3.4}/**'
  - '!node_modules/zod/src/**'
  - '!node_modules/undici/docs/**'
  - '!node_modules/**/*.d.{cts,mts}'
# The app spawns real child processes out of node_modules (claude cli.js,
# vtsls); asar would hide them behind a virtual path. Size over surprises.
asar: false
# ELECTRON_RUN_AS_NODE leaks into agent shells and even rides through
# `open` — with the fuse off the installed app simply ignores it.
electronFuses:
  runAsNode: false
npmRebuild: false
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  # Apple silicon only for now: the IntelliJ engine and every verified
  # path are arm64; an Intel build is untested and not offered.
  target:
    - target: zip
      arch: arm64
    - target: dmg
      arch: arm64
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Signing: electron-builder picks the "Developer ID Application" identity
  # from the login Keychain; `bun run release:publish` names it explicitly.
  # Without one (a stranger's clone) the app is built unsigned and macOS
  # reports it damaged — that is expected, only published builds are signed.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Not notarized by default: Squirrel validates an update against the
  # installed app's designated requirement, so the Developer ID signature is
  # what makes updates install, and Gatekeeper reads a notarization ticket
  # only on a quarantined bundle (a browser download). `bun run
  # release:publish --notarize` turns it on (-c.mac.notarize=true with
  # APPLE_KEYCHAIN_PROFILE in the environment) for a release someone else
  # will download. A published build MUST be signed either way.
  notarize: false
  # Mach-O files outside the Electron frameworks are not signed by default;
  # the Appshots helper and tc-computer must carry the same identity or
  # notarization rejects the bundle.
  binaries:
    - Contents/Resources/app/resources/native/appshot-helper
    - Contents/Resources/app/resources/native/tc-computer
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    # One string for every app TempCode scripts: Office for Work's agents (docs/agents/work-office.md)
    # and Terminal after an account switch. Under the hardened runtime macOS asks only when the
    # entitlements also carry com.apple.security.automation.apple-events.
    - NSAppleEventsUsageDescription: TempCode drives Excel, Word, PowerPoint and Outlook for your agents, and restarts your terminal sessions after switching accounts.
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
# Windows: built unsigned, on the Mac or the box, with `--config build/electron-builder.win.yml` (that file
# adds the file rules only a Windows pack needs; `release:publish --win` and the updater proof pass
# it; docs/agents/windows-build.md).
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: x64
    # For a PC that refuses the installer: unzip to %LOCALAPPDATA%\Programs\TempCode. A copy made
    # this way does not update itself.
    - target: zip
      arch: x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  # The empty signing hook: electron-builder calls it for every executable and it signs nothing.
  # A certificate goes in there only if a machine refuses the unsigned build.
  signtoolOptions:
    signingHashAlgorithms: [sha256]
    sign: ./build/sign-win.mjs
# Per user, no admin: one click into %LOCALAPPDATA%\Programs\TempCode (build/installer.nsh names
# the folder after the product). "Restart to update" runs the same installer with its own window.
nsis:
  oneClick: true
  perMachine: false
  include: build/installer.nsh
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
# Update feed: the public source repo's own releases (latest-mac.yml beside
# the zip; latest.yml beside the Windows installer), polled unauthenticated
# by electron-updater.
publish:
  provider: github
  owner: LandonDev
  repo: temp-code
