<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TempCode</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="core.js"></script>
    <script src="taskpane.js"></script>
    <style>
      :root { color-scheme: light dark; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      body { margin: 0; padding: 16px; }
      h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
      p { margin: 0; color: GrayText; }
      form { display: flex; gap: 8px; margin-top: 16px; }
      input { flex: 1; min-width: 0; padding: 6px 8px; font: inherit; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid GrayText; border-radius: 6px; background: Canvas; color: CanvasText; }
      button { padding: 6px 12px; font: inherit; border: 0; border-radius: 6px; background: #1f6feb; color: #fff; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <h1>TempCode</h1>
    <p id="status">Loading…</p>
    <form id="pair" hidden>
      <input id="code" autocomplete="off" spellcheck="false" maxlength="8" placeholder="Code" aria-label="Pairing code from TempCode" />
      <button id="go" type="submit" disabled>Pair</button>
    </form>
  </body>
</html>
