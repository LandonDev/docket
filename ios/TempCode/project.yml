# The iOS app, generated into TempCode.xcodeproj by `xcodegen generate`
# (scripts/ios-sim-proof.sh and scripts/ios-device.sh do it). The app is a
# thin SwiftUI shell over ../TempCodeClient plus the Live Activity extension.
#
# Signing: the simulator build is ad hoc (no team, these base settings). A
# device build overrides them on the xcodebuild command line with the team
# id scripts/ios-device.sh reads from TEMP_CODE_APPLE_TEAM or the untracked
# ios/TempCode/Local.xcconfig (`DEVELOPMENT_TEAM = XXXXXXXXXX`), automatic
# signing and -allowProvisioningUpdates; nothing about the team lives here.
name: TempCode
options:
  bundleIdPrefix: dev.landon.tempcode
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    # Ad hoc signing: enough for the simulator, and the Keychain needs the
    # application identifier the signature carries.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    AD_HOC_CODE_SIGNING_ALLOWED: YES
    TARGETED_DEVICE_FAMILY: "1"
    # One minimum with work-kit's LifeKit (landed/M45.md): SwiftPM refuses a package newer than its client.
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    # convex-swift (under LifeKit) ships no x86_64 simulator slice.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    # LifeKit's ink reads the app's accent; without the asset it draws clear.
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
packages:
  TempCodeClient:
    path: ../TempCodeClient
  TempCodeContract:
    path: ../TempCodeContract
  # work-kit's Swift half: LifeKit, LifeKitUI and LifeKitCore. The revision is the commit
  # package.json pins for the JS half (scripts/workKitPin.test.ts holds them equal). The app
  # links LifeKit and LifeKitUI (milestone 47: a Work workspace's Mail, Tasks and Agenda); a
  # widget or an extension only ever links LifeKitCore.
  WorkKit:
    url: https://github.com/LandonDev/work-kit
    revision: c56e3637b21e43e004ed392f030f4de9a9177912
targets:
  TempCode:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # The Live Activity's attributes, compiled into the app and the extension.
      - path: Activity/Shared
    dependencies:
      - package: TempCodeClient
        product: TempCodeClient
      - package: WorkKit
        product: LifeKit
      - package: WorkKit
        product: LifeKitUI
      - target: TempCodeActivity
      - target: TempCodeNotificationService
    entitlements:
      path: TempCode.entitlements
      properties:
        # APNs. A development-signed build registers with the sandbox gateway;
        # the app reads the value off its provisioning profile and tells the host.
        aps-environment: development
        # The host directory the notification service extension reads (HostDirectory.swift).
        com.apple.security.application-groups:
          - group.dev.landon.tempcode
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: TempCode
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # The outer display: portrait and both landscapes, never upside-down; the inner display ignores the key.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - remote-notification
        NSSupportsLiveActivities: true
        # ProMotion: without it a display link (the streaming reveal) and SwiftUI animations stop at 60 Hz.
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.landon.tempcode.ios
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        # The catalog holds no app icon (the app has never had one); the application preset names AppIcon.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        # LifeKitUI calls presentationPlacement behind #available(iOS 27.1, *), but the SDK marks it 27.0,
        # so the symbol is bound strongly and dyld refuses the app on the iOS 27.0 simulator runtime, which
        # lacks it. Weak, the missing symbol is null and the availability check skips it.
        OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "SwiftUI"]
  # The Live Activity (lock screen and Dynamic Island) for a running thread:
  # a WidgetKit extension with the activity configuration alone.
  TempCodeActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: Activity
      # The app's tokens and type glyphs, so the banner is the strip's.
      - path: Sources/Design/Tokens.swift
      - path: Sources/Design/Glyphs.swift
    dependencies:
      # Tokens.swift reads the shared transcript type and lengths.
      - package: TempCodeClient
        product: TempCodeClient
      - package: TempCodeContract
        product: TempCodeContract
    info:
      path: Activity/Info.plist
      properties:
        CFBundleDisplayName: TempCode
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.landon.tempcode.ios.activity
        INFOPLIST_KEY_CFBundleDisplayName: TempCode
  # The notification service extension: adds the host's name to an alert's
  # subtitle when the phone pairs with several hosts (the host cannot know).
  TempCodeNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
      # The App Group's host directory, published by the app.
      - path: Sources/Push/HostDirectory.swift
    entitlements:
      path: NotificationService/NotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.landon.tempcode
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: TempCode
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.landon.tempcode.ios.notificationservice
        INFOPLIST_KEY_CFBundleDisplayName: TempCode
        # UNNotificationServiceExtension's overrides are nonisolated and run off the main thread.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
  TempCodeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: TempCode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.landon.tempcode.ios.uitests
        TEST_TARGET_NAME: TempCode
        # XCTest's overrides are nonisolated; the app's main-actor default would clash.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  TempCode:
    build:
      targets:
        TempCode: all
        TempCodeActivity: all
        TempCodeNotificationService: all
        TempCodeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TempCodeUITests
